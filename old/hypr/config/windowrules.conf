# # Screen sharing
windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = float-center
    match:float = true
    center = on
}

windowrule {
    name = floating-stuff
    match:class = ^(blueman-manager|nm-connection-editor|btop)$
    float = yes
    # size = (monitor_w*0.5) (monitor_w*0.5*3/4)
    # min_size = (monitor_w*0.3) (monitor_w*0.3*3/4)
}

windowrule {
    name = floating-stuff2
    match:class = ^(xdg-desktop-portal-gtk)$
    float = yes
    # size = (monitor_w*0.5) (monitor_w*0.5*3/4)
    # min_size = (monitor_w*0.3) (monitor_w*0.3*3/4)
}

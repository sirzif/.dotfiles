source = ~/.config/hypr/conf/binds.conf
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/exec.conf

################
### MONITORS ###
################

monitorv2 {
  output = eDP-1
  mode = 1920x1080@60
  position = 1920x0
  scale = 1
}
monitorv2 {
  output = HDMI-A-1
  mode = 1920x1080@144
  position = 0x0
  scale = 1
}
# monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 4,0,0,0

    border_size = 1

    col.active_border = rgb(f84a12)
    col.inactive_border = rgba(202426aa)

    resize_on_border = true

    allow_tearing = true

    layout = master
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.2
        noise = 0.02
    }
}

animations {
    # cool but idk
    enabled = false

    bezier = wind, 0.05, 0.85, 0.03, 0.97
    bezier = winIn, 0.07, 0.88, 0.04, 0.99
    bezier = winOut, 0.20, -0.15, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = md3_standard, 0.12, 0, 0, 1
    bezier = md3_decel, 0.05, 0.80, 0.10, 0.97
    bezier = md3_accel, 0.20, 0, 0.80, 0.08
    bezier = overshot, 0.05, 0.85, 0.07, 1.04
    bezier = crazyshot, 0.1, 1.22, 0.68, 0.98
    bezier = hyprnostretch, 0.05, 0.82, 0.03, 0.94
    bezier = menu_decel, 0.05, 0.82, 0, 1
    bezier = menu_accel, 0.20, 0, 0.82, 0.10
    bezier = easeInOutCirc, 0.75, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.48, 0.38, 1
    bezier = easeOutExpo, 0.10, 0.94, 0.23, 0.98
    bezier = softAcDecel, 0.20, 0.20, 0.15, 1
    bezier = md2, 0.30, 0, 0.15, 1

    bezier = OutBack, 0.28, 1.40, 0.58, 1
    bezier = easeInOutCirc, 0.78, 0, 0.15, 1

    animation = border, 1, 1.6, liner
    animation = borderangle, 1, 82, liner, loop
    animation = windowsIn, 1, 3.2, winIn, slide
    animation = windowsOut, 1, 2.8, easeOutCirc
    animation = windowsMove, 1, 3.0, wind, slide
    animation = fade, 1, 1.8, md3_decel
    animation = layersIn, 1, 1.8, menu_decel, slide
    animation = layersOut, 1, 1.5, menu_accel
    animation = fadeLayersIn, 1, 1.6, menu_decel
    animation = fadeLayersOut, 1, 1.8, menu_accel
    animation = workspaces, 1, 4.0, menu_decel, slide
    animation = specialWorkspace, 1, 2.3, md3_decel, slidefadevert 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
    disable_autoreload = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us,lt
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle, ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.2

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
    numlock_by_default = true
}

cursor {
    no_hardware_cursors = true
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# # Screen sharing
windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = floating-stuff
    match:class = ^(blueman-manager|nm-connection-editor)$
    float = yes
    size = 800 600
}

workspace = w[tv1]s[false], gapsout:4 0 0 0, gapsin:0
workspace = f[1]s[false], gapsout:4 0 0 0, gapsin:0
# windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]
# windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false]
# windowrule = border_size 0, match:float 0, match:workspace f[1]s[false]
# windowrule = rounding 0, match:float 0, match:workspace f[1]s[false]
